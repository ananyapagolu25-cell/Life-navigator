<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decision Helper | Life Navigator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 40px;
        }
        h1 {
            text-align: center;
        }
        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Decision Helper</h1>

    <div class="box">
        <label>What decision are you trying to make?</label>
        <textarea placeholder="Example: Should I change my job?"></textarea>

        <label>Option A</label>
        <input type="text" placeholder="Example: Stay in current job">

        <label>Option B</label>
        <input type="text" placeholder="Example: Switch to new company">

        <button>Analyze Decision</button>
    </div>

</body>
</html>
