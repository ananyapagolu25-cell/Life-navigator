<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decision Helper | Life Navigator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 40px;
        }
        h1 {
            text-align: center;
        }
        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #4a6cf7;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
        a {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Decision Helper</h1>

<div class="box">
    <label>Your Decision</label>
    <input type="text" id="decision" placeholder="Eg: Should I change my job?">

    <label>Option A</label>
    <input type="text" id="a">

    <label>Option B</label>
    <input type="text" id="b">

    <button onclick="analyze()">Help Me Decide</button>

    <div id="result"></div>

    <a href="index.html">⬅ Back to Home</a>
</div>

<script>
function analyze() {
    const decision = document.getElementById("decision").value;
    const a = document.getElementById("a").value;
    const b = document.getElementById("b").value;

    if (!decision || !a || !b) {
        document.getElementById("result").innerText =
            "Please fill all fields.";
        return;
    }

    document.getElementById("result").innerText =
        "Based on clarity, think deeply about '" + a +
        "' vs '" + b +
        "'. If peace matters more, choose the option that feels lighter.";
}
</script>

</body>
</html>
