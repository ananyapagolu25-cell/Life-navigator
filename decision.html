<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decision Helper | Life Navigator</title>
  <link rel="stylesheet" href="style.css">
</head>
  <body class="dark">

  <div class="decision-container">

    <h1 class="title">Decision Helper</h1>
    <p class="subtitle">
      Let’s break this down calmly and clearly.
    </p>

    <!-- Step 1 -->
    <div class="card">
      <label>What decision are you trying to make?</label>
      <input type="text" placeholder="e.g. Should I change my job?" />
    </div>

    <!-- Step 2 -->
    <div class="card">
      <label>Option A</label>
      <input type="text" placeholder="Describe option A" />
    </div>

    <!-- Step 3 -->
    <div class="card">
      <label>Option B</label>
      <input type="text" placeholder="Describe option B" />
    </div>

    <button class="primary-btn">
      Help me decide →
    </button>

  </div>

</body>
</html>
