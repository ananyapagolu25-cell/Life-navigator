<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decision Helper | Life Navigator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1117;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 80px auto;
      padding: 30px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 25px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #1f2933;
      color: #fff;
      font-size: 1rem;
    }

    button {
      margin-top: 35px;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      cursor: pointer;
    }

    .result {
      margin-top: 40px;
      padding: 20px;
      border-radius: 12px;
      background: #111827;
      display: none;
    }
  </style>
</head>
<body class="dark">

  <div class="decision-container">
    <h1>Decision Helper</h1>
    <p class="subtitle">Think clearly. Decide calmly.</p>

    <!-- Step 1 -->
    <div class="card">
      <label>Your decision</label>
      <input type="text" id="decision" placeholder="e.g. Should I change my job?">
    </div>

    <!-- Step 2 -->
    <div class="card">
      <label>Option A</label>
      <input type="text" id="optionA" placeholder="e.g. Stay at current job">
    </div>

    <div class="card">
      <label>Option B</label>
      <input type="text" id="optionB" placeholder="e.g. Switch to new job">
    </div>

    <!-- Step 3 -->
    <div class="card">
      <label>What matters more?</label>
      <select id="priority">
        <option value="growth">Growth</option>
        <option value="peace">Peace</option>
        <option value="money">Money</option>
        <option value="balance">Work-Life Balance</option>
      </select>
    </div>

    <button onclick="analyzeDecision()">Help me decide</button>

    <!-- Result -->
    <div id="result" class="result-box"></div>
  </div>

  <script src="decision.js"></script>
</body>
</html>
